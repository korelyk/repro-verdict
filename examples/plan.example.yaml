# Worked example: reproducing the KELM baseline table of
# "GSA-KELM-KF: A Hybrid Model for Short-Term Traffic Flow Forecasting"
# (Mathematics 12(1):103, 2024). Numbers come from a real run.

paper: "10.3390/math12010103"
title: "GSA-KELM-KF: A Hybrid Model for Short-Term Traffic Flow Forecasting"

# We do not expect bit-identical numbers: the paper does not state the random
# seed, and its GSA settings are incomplete. Trend-level agreement is the goal.
target_grade: B

tolerances:
  A: 0.001 # 0.1 percent relative error
  B: 0.05  # 5 percent relative error

claims:
  - key: rmse
    group: A1
    claimed: 284.83
    unit: vehs/h
  - key: rmse
    group: A2
    claimed: 193.58
    unit: vehs/h
  - key: rmse
    group: A4
    claimed: 221.36
    unit: vehs/h
  - key: rmse
    group: A8
    claimed: 162.84
    unit: vehs/h

environment:
  gpu: "2x RTX 4090 24GB"
  cpu: "80 cores"
  python: "3.10.12 (system interpreter, no conda)"
  libraries: "numpy 2.2.6, scipy 1.15.3, scikit-learn 1.7.2"
  data: "PeMS sections A1/A2/A4/A8, 5-minute flow, 2019-09"

gaps:
  - "GSA gravitational constant, iteration count and velocity bounds are not stated."
  - "The Kalman filter weights (0.3 / 0.7) are given without derivation."
  - "The Kalman filter is fed the previous true observation, which makes it close to a naive persistence rule."

notes:
  - "KELM (gamma, sigma) chosen by grid search: (0.01, 2.0)."
  - "The paper's own ablation table shows GSA-KELM scoring worse than plain KELM."
