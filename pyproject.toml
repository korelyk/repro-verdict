[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repro-verdict"
version = "0.3.0"
description = "Auditable acceptance checking for paper reproduction: deterministic metric grading, a weighted requirement tree, and a role-based LLM reviewer panel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yuan Jingdong", email = "y736330394@gmail.com" }]
keywords = ["reproducibility", "reproduction", "research-tooling", "evaluation", "llm-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
repro-verdict = "repro_verdict.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repro_verdict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
